# agentgateway as the A2A gateway: agents never call each other directly.
#   agent -> agent: kagent's proxy.url sends every agent-as-tool call to the gateway with header
#                   x-kagent-host: <agent>.<namespace>; route <release>-internal, key users a2aCallers only
#   client -> agent: /a2a/<agent> for agents marked public; route a2a-<agent>, key user support-app only
# The gateway rewrites each agent card's URL to its own address, so A2A clients keep going through it.
# A/B test (abTests): the tested agent's calls are split by weight between it and its variant; header
# x-agent-variant: a|b pins a call to one of them (evaluations, tests).
{{- $gw := .Values.gateway }}
{{- $internal := printf "%s-internal" .Release.Name }}
{{- range $name, $a := include "card-support.agents" . | fromYaml }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: agent-{{ $name }}
  namespace: {{ $gw.namespace }}
spec:
  a2a: {host: {{ $name }}.{{ $.Release.Namespace }}.svc.cluster.local, port: 8080}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $internal }}
  namespace: {{ $gw.namespace }}
spec:
  parentRefs: [{name: {{ $gw.name }}}]
  rules:
    {{- range $name, $a := .Values.agents }}
    {{- $host := dict "name" "x-kagent-host" "value" (printf "%s.%s" $name $.Release.Namespace) }}
    {{- with index (default dict $.Values.abTests) $name }}
    - matches: [{path: {type: PathPrefix, value: /}, headers: [{{ toJson $host }}, {name: x-agent-variant, value: a}]}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: agent-{{ $name }}}]
      timeouts: {request: 300s}
    - matches: [{path: {type: PathPrefix, value: /}, headers: [{{ toJson $host }}, {name: x-agent-variant, value: b}]}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: agent-{{ .variant }}}]
      timeouts: {request: 300s}
    - matches: [{path: {type: PathPrefix, value: /}, headers: [{{ toJson $host }}]}]
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: agent-{{ $name }}, weight: {{ sub 100 .weight }}}
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: agent-{{ .variant }}, weight: {{ .weight }}}
      timeouts: {request: 300s}
    {{- else }}
    - matches: [{path: {type: PathPrefix, value: /}, headers: [{{ toJson $host }}]}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: agent-{{ $name }}}]
      timeouts: {request: 300s}
    {{- end }}
    {{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $internal }}
  namespace: {{ $gw.namespace }}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: {{ $internal }}}]
  traffic:
    apiKeyAuthentication:
      mode: Strict
      configMapSelector: {matchLabels: {agentgateway.dev/apikey: "true"}}
    authorization:
      action: Allow
      policy:
        matchExpressions: [{{ printf "apiKey.user_id in %s" (toJson .Values.a2aCallers) | quote }}]
    rateLimit:
      local:
        - {requests: {{ $gw.rateLimit.requests }}, unit: Minutes, burst: {{ $gw.rateLimit.burst }}}
{{- range $name, $a := .Values.agents }}{{ if $a.public }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-{{ $name }}
  namespace: {{ $gw.namespace }}
spec:
  parentRefs: [{name: {{ $gw.name }}}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /a2a/{{ $name }}}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: agent-{{ $name }}}]
      timeouts: {request: 300s}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: a2a-{{ $name }}
  namespace: {{ $gw.namespace }}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: a2a-{{ $name }}}]
  traffic:
    apiKeyAuthentication:
      mode: Strict
      configMapSelector: {matchLabels: {agentgateway.dev/apikey: "true"}}
    authorization:
      action: Allow
      policy:
        matchExpressions: ['apiKey.user_id == "support-app"']
    rateLimit:
      local:
        - {requests: {{ $gw.rateLimit.requests }}, unit: Minutes, burst: {{ $gw.rateLimit.burst }}}
{{- end }}{{ end }}
