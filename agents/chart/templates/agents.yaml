# System prompts, one key per agent (prompts/<name>.md)
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-prompts
data:
  {{- range $name, $a := .Values.agents }}
  {{ $name }}: |
{{ $.Files.Get (printf "prompts/%s.md" $name) | indent 4 }}
  {{- end }}
{{- range $name, $a := .Values.agents }}
---
# replicas are left to KEDA (scaledobjects.yaml): the controller sets them only when spec.deployment.replicas is set
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $name }}
spec:
  type: Declarative
  description: {{ $a.description | quote }}
  declarative:
    {{- include "card-support.declarative" (dict "name" $name "a" $a "root" $) | nindent 4 }}
    deployment:
      labels: {app.kubernetes.io/part-of: card-support}
      resources: {{- toYaml $.Values.resources | nindent 8 }}
{{- end }}
