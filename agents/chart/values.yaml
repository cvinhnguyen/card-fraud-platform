# Install (namespace kagent; MCP servers from services/card_support_mcp/chart, keys from infra/k8s/secrets.sh):
#   helm upgrade --install card-support-agents agents/chart -n kagent --atomic --timeout 5m
modelConfig: default-model-config   # the global model config: agentgateway -> llm-d -> Qwen3-8B
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 384Mi}

gateway:
  namespace: agentgateway-system
  name: agentgateway-proxy
  rateLimit: {requests: 120, burst: 20}   # per minute and route

# KEDA: each agent's Deployment scales on its A2A request rate through the gateway (Prometheus), averaged per
# replica. A conversation takes ~40 s (locust, 2026-10-20), so 0.04 req/s per replica is ~1.6 concurrent
# conversations each (rate x duration). Agent replicas add no LLM capacity (one GPU behind llm-d); they keep a
# slow conversation from blocking the others.
autoscaling:
  minReplicas: 2
  maxReplicas: 4
  requestsPerSecond: "0.04"
  prometheus: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090

# Network: agents accept and open connections only on the gateway path (templates/networkpolicy.yaml)
networkPolicy:
  enabled: true
  tracingNamespace: monitoring

# Agent Substrate (warm-up, agent fleet): a <name>-sandbox SandboxAgent per agent, all sharing the worker pool.
# Egress only to the gateway (LLM, MCP, A2A) and the kagent controller (sessions).
sandbox:
  enabled: true
  workerPool: kagent-default
  allowedDomains:
    - agentgateway-proxy.agentgateway-system.svc.cluster.local
    - kagent-controller.kagent.svc.cluster.local

# One entry per agent. mcpServer + tools: its tools on the MCP gateway (the key of that RemoteMCPServer allows only
# these). subAgents: agents it calls over A2A through the gateway, with its key a2a-key-<name>. public: reachable by
# A2A clients at /a2a/<name> on the gateway (key user support-app). The system prompt is prompts/<name>.md.
agents:
  card-data-agent:
    description: Live data of the customer's card (profile, recent activity, 30/90/180-day history) and sections of the bank's card documents by id.
    mcpServer: card-support-card-data-agent
    tools: [get_card_data, get_policy_chunk]
    skills:
      - id: card-data
        name: Card data
        description: What the bank's live data says about one card.
        examples: ["How many payments did card card_00006087 make in the last 30 days?"]
  risk-agent:
    description: Fraud check of a payment the customer describes (the bank's fraud model) and answers from the bank's card policies (RAG).
    mcpServer: card-support-risk-agent
    tools: [score_payment, search_policy]
    skills:
      - id: payment-check
        name: Payment check
        description: Would the bank approve, ask for extra authentication, or decline this payment, and why.
        examples: ["Will a 45,000,000 VND online payment on card card_00006087 go through?"]
      - id: policy
        name: Card policy
        description: Fees, liability, disputes and authentication rules, with the document and section.
        examples: ["Am I liable if someone used my card abroad?"]
  coordinator:
    description: Card support assistant of the bank. Talks to the customer and asks the card data agent and the risk agent.
    subAgents: [card-data-agent, risk-agent]
    public: true
    skills:
      - id: card-support
        name: Card support
        description: Answers a customer's question about their card, a payment or the bank's card rules.
        examples: ["My online payment of 45 million was declined on card card_00006087, why?"]
