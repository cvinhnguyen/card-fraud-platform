# Two releases of this chart, one per CD pipeline (agents/Jenkinsfile.*); the agents themselves are in the values file
# of each release. MCP servers from services/card_support_mcp/chart, keys from infra/k8s/secrets.sh (Vault):
#   helm upgrade --install card-support-data-agents agents/chart -n kagent -f agents/chart/values-data-agents.yaml
#   helm upgrade --install card-support-coordinator agents/chart -n kagent -f agents/chart/values-coordinator.yaml
# System prompts: prompts/<agent>.md, replaced by the pipeline with the Langfuse prompt card-support/<agent> labelled
# production (promptVersions records which version is deployed, as an annotation on each Agent).
modelConfig: default-model-config   # the global model config: agentgateway -> llm-d -> Qwen3-8B
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 384Mi}

gateway:
  namespace: agentgateway-system
  name: agentgateway-proxy
  rateLimit: {requests: 120, burst: 20}   # per minute and route

# KEDA: each agent's Deployment scales on its A2A request rate through the gateway (Prometheus), averaged per
# replica. A conversation takes ~40 s (locust, 2026-10-20), so 0.04 req/s per replica is ~1.6 concurrent
# conversations each (rate x duration). Agent replicas add no LLM capacity (one GPU behind llm-d); they keep a
# slow conversation from blocking the others.
autoscaling:
  minReplicas: 2
  maxReplicas: 4
  requestsPerSecond: "0.04"
  prometheus: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090

# Network: agents accept and open connections only on the gateway path (templates/networkpolicy.yaml)
networkPolicy:
  enabled: true
  tracingNamespace: monitoring

# Agent Substrate (warm-up, agent fleet): a <name>-sandbox SandboxAgent per agent, all sharing the worker pool.
# Egress only to the gateway (LLM, MCP, A2A) and the kagent controller (sessions).
sandbox:
  enabled: true
  workerPool: kagent-default
  allowedDomains:
    - agentgateway-proxy.agentgateway-system.svc.cluster.local
    - kagent-controller.kagent.svc.cluster.local

# One entry per agent (set in values-*.yaml). mcpServer + tools: its tools on the MCP gateway (the key of that
# RemoteMCPServer allows only these). subAgents: agents it calls over A2A through the gateway, with its key
# a2a-key-<name>. public: reachable by A2A clients at /a2a/<name> on the gateway (key user support-app).
agents: {}
# gateway key users allowed to call this release's agents agent-to-agent (route <release>-internal)
a2aCallers: []
promptVersions: {}   # <agent>: <Langfuse prompt version>, set by the pipeline
