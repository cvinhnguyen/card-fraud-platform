# Generator configuration. Every share/rate lives here, not in code,
# so the same pipeline can be benchmarked at different skew levels.

seed: 42
output_dir: data/source          # relative to repo root; gitignored

period:
  start: 2024-01-01
  end: 2026-10-15                # inclusive; fixed (not "today") so reruns reproduce the same data

volume:                          # ~1 GB of source data; `generate.py --scale 0.05` for a quick smoke test
  n_customers: 100000
  n_merchants: 5000
  n_transactions: 8000000
  n_sessions: 2200000            # app sessions, ~2.5 events each

trends:
  atm_decline_per_year: 0.17     # ATM share of card payments shrinks yearly (SBV 2025: ATM volume -17.3% YoY);
                                 # the lost share goes to non-top merchants, so the top-10 skew stays fixed

skew:
  merchant:
    top_n_merchants: 10
    top_share: 0.70              # primary: join skew
  txn_city:                      # shares on the 34 new units (new_unit_name)
    Ho Chi Minh: 0.60            # secondary: storage layout / hot key
    Ha Noi: 0.18
    Da Nang: 0.05
    others: 0.17                 # Zipf-like tail over the remaining 31 units

reorganization:
  cutoff: 2025-07-01             # Resolution 202/2025/QH15: 63 provinces -> 34 units
  stale_share_after_cutoff: 0.05 # legacy POS / systems still sending old names
  namesake_weight: 0.6           # default share of a merged unit that maps back to the province keeping its name
  back_map_weights:              # overrides per new unit (old name -> weight)
    Ho Chi Minh: {Ho Chi Minh: 0.80, Binh Duong: 0.13, Ba Ria-Vung Tau: 0.07}

foreign:                         # cross-border online payments: card-not-present abroad, the riskiest channel
  share: 0.04                    # of transactions, taken from the domestic long tail (the top-10 skew stays 0.70)
  n_merchants: 200               # on top of volume.n_merchants; Zipf-like popularity, online only, currency USD
  countries: {US: 0.45, SG: 0.20, IE: 0.15, CN: 0.10, GB: 0.10}
  mcc: {5815: Digital Content, 5816: Online Games, 5311: Online Store, 4722: Travel Booking, 5734: Software}

duplicates:
  offline_rate: 0.02             # nightly export re-run after timeout

scd2:                            # customers: one row per version (SCD2 source)
  move_rate_per_year: 0.05       # customer moves to another unit
  rescore_rate_per_year: 0.10    # risk_tier re-scored
  # plus: on the reorganization date the core system relabels old province names (spurious version)

terminals:                       # high cardinality: terminal_id on POS / ATM transactions (null for ecom)
  chain: 3000                    # per convenience chain (super merchant, not online)
  atm_network: 400               # per ATM network merchant
  other_pos_max: 5               # other POS merchants: 1..this many terminals

labels:                          # disputes table + label delay
  fraud_rate: 0.003
  non_fraud_dispute_rate: 0.001  # disputes that end up not fraud (not received, duplicate charge, ...)
  dispute_delay_days: {median: 14, p95: 45, min: 1, max: 60}   # truncated log-normal
  risk_weights: {ecom: 3.0, night: 2.0, high_amount: 2.0, otp: 1.5, foreign: 3.0}   # relative fraud risk, normalized to fraud_rate

devices:                         # customers' phones, shared by online card payments and app sessions (device_id)
  extra_per_customer: 0.5        # 1 + Poisson(0.5) phones per customer
  primary_share: 0.85            # app sessions on the main phone

card_authorizations:             # Kafka source 1: the card network's request for each payment
  network_delay_s: [0.05, 2.0]   # normal delivery latency, uniform
  late_share_of_pos: 0.10        # offline POS store-and-forward, sent when the terminal reconnects (~2.4% of all)
  late_delay_min: [5, 30]
  duplicate_rate: 0.015          # network retry without an ack: same auth_id, later received_ts
  retry_delay_s: [1, 10]

app_events:                      # Kafka source 2: mobile banking app, one session = login ... transfers
  failed_login_share: 0.05       # sessions that start with 1-2 wrong passwords
  password_reset_share: 0.01     # legit customers who forgot the password
  change_phone_share: 0.002
  transfers_per_session: {0: 0.35, 1: 0.45, 2: 0.15, 3: 0.05}
  new_payee_share: 0.10          # p2p transfers to a payee added in the same session
  qr_share: {start: 0.45, growth_per_year: 0.15}   # VietQR at shops among transfers (SBV 2025: QR +51% volume)
  shops: 5000                    # QR payees, Zipf-like popularity
  transfer_auth_method: {device_biometric: 0.85, smart_otp_pin: 0.10, sms_otp: 0.05}
  out_of_order_share: 0.15       # events that reach Kafka after the next event of their session
  max_disorder_s: 20
  ato:                           # account takeover attempts
    share: 0.01                  # of sessions (inflated so the smoke test has enough cases)
    remote_share: 0.40           # after the cutoff: malware on the victim's phone, transfers split below 10M
    attacker_devices: 50         # fraud rings reuse phones across victims
    mule_payees: 100
  biometric:                     # Decision 2345/QĐ-NHNN identity check, from 2024-07-01
    cutoff: 2024-07-01
    single_transfer_vnd: 10000000   # >= this amount
    daily_total_vnd: 20000000       # the day's total goes above this
    pass_rate_legit: 0.99
    pass_rate_ato: 0.10

schema_evolution:                # Decision 2345/QĐ-NHNN + Circular 18/2024/TT-NHNN both effective 2024-07-01
  cutoff: 2024-07-01             # auth_method + three_ds_version exist only from this transaction date
  auth_method:                   # how the card payment was authenticated, per channel (assumed shares)
    ecom: {3ds_otp: 0.70, 3ds_app: 0.30}       # SMS / Smart OTP vs approval in the bank app
    pos: {chip_pin: 0.60, contactless: 0.40}
    atm: {pin: 1.0}
  three_ds_version: {"2.2.0": 0.85, "2.1.0": 0.15}   # ecom only

# Super merchants: 70% of transactions. ATM merchants use mcc 6011.
super_merchants:
# Names are generic on purpose: synthetic data, no real brands.
  - {name: E-Wallet A Top-up, mcc: 6540, is_online: true}
  - {name: E-Wallet B Top-up, mcc: 6540, is_online: true}
  - {name: E-Wallet C Top-up, mcc: 6540, is_online: true}
  - {name: E-Wallet D Top-up, mcc: 6540, is_online: true}
  - {name: Ride-Hailing A, mcc: 4121, is_online: true}
  - {name: Ride-Hailing B, mcc: 4121, is_online: true}
  - {name: Marketplace A, mcc: 5399, is_online: true}
  - {name: Marketplace B, mcc: 5399, is_online: true}
  - {name: Convenience Chain A, mcc: 5411, is_online: false}
  - {name: Convenience Chain B, mcc: 5411, is_online: false}
