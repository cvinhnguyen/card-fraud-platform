[mutmut]
# Mutate the decision logic changed in this phase (rubric: only changed code); the rest of `app` is copied, not mutated
source_paths =
    app
do_not_mutate =
    app/main.py
    app/clients.py
    app/schemas.py
    app/settings.py
pytest_add_cli_args_test_selection =
    tests/
# the coverage gate belongs to the normal run: mutmut runs a trampolined copy of the code
pytest_add_cli_args =
    -o
    addopts=
