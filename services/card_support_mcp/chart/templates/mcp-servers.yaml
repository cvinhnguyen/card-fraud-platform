# One kagent tool server per agent: the same gateway URL, each with that agent's key (Secret mcp-key-<agent>), so the
# gateway shows each agent only its own tools.
{{- range $agent, $tools := .Values.agents.access }}
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: card-support-{{ $agent }}
  namespace: {{ $.Values.agents.namespace }}
spec:
  description: "Card support tools for {{ $agent }}: {{ join ", " $tools }}"
  url: http://{{ $.Values.gateway.name }}.{{ $.Values.gateway.namespace }}.svc.cluster.local{{ $.Values.gateway.path }}
  protocol: STREAMABLE_HTTP
  timeout: 30s
  headersFrom:
    - name: Authorization
      valueFrom: {type: Secret, name: mcp-key-{{ $agent }}, key: Authorization}
{{- end }}
