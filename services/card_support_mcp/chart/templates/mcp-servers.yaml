# The agents' handle on this server's tools in kagent: the gateway route of this server, called with the key of its
# agent (Secret mcp-key-<agent>), so the gateway lets the agent see and call these tools and nothing else.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.kagentNamespace }}
spec:
  description: {{ .Values.description | quote }}
  url: http://{{ .Values.gateway.name }}.{{ .Values.gateway.namespace }}.svc.cluster.local/mcp/{{ .Values.server }}
  protocol: STREAMABLE_HTTP
  timeout: 30s
  headersFrom:
    - name: Authorization
      valueFrom: {type: Secret, name: mcp-key-{{ .Values.agent }}, key: Authorization}
