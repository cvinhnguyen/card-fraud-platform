# This server's MCP entry point on agentgateway, /mcp/<server>: agents call the gateway, never the server directly.
{{- $ns := .Values.gateway.namespace }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ .Release.Name }}
  namespace: {{ $ns }}
spec:
  mcp:
    sessionRouting: Stateless   # the server keeps no MCP session: any replica answers any call
    targets:
      - name: {{ .Values.server }}
        static:
          host: {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
          port: 8000
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ $ns }}
spec:
  parentRefs: [{name: {{ .Values.gateway.name }}}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /mcp/{{ .Values.server }}}}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ .Release.Name }}}]
---
# Who: an API key from agentgateway-api-keys. How much: a request rate limit. What: only the key of this server's
# agent sees its tools (the rule runs once per tool, in tools/list and in tools/call); any other key, even a valid
# one, sees no tool here.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ $ns }}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: {{ .Release.Name }}}]
  traffic:
    apiKeyAuthentication:
      mode: Strict
      configMapSelector: {matchLabels: {agentgateway.dev/apikey: "true"}}
    rateLimit:
      local:
        - {requests: {{ .Values.gateway.rateLimit.requests }}, unit: Minutes, burst: {{ .Values.gateway.rateLimit.burst }}}
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - {{ printf "apiKey.user_id == %q" (required "agent: the gateway key user allowed to use these tools" .Values.agent) | quote }}
