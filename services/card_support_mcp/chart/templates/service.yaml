{{/* ClusterIP Service of the MCP server pods (port 8000): reached by agentgateway, Prometheus and NGINX only. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  selector: {app: {{ .Release.Name }}}
  ports:
    - {name: http, port: 8000, targetPort: http, appProtocol: agentgateway.dev/mcp}
