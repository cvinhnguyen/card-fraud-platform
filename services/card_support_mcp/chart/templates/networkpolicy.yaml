{{- if .Values.networkPolicy.enabled }}
# Who may reach this server: the gateway (agents, with the per-server key rule), Prometheus (/metrics), pods of this
# namespace (load tests) and, for the public Web API only, the NGINX ingress (basic auth + HTTPS there). Agents
# cannot skip the gateway's rules by calling the server directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.gateway.namespace }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Values.gateway.name }}}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
        {{- if .Values.networkPolicy.public }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}}}
        {{- end }}
        - podSelector: {}
      ports: [{port: 8000, protocol: TCP}]
{{- end }}
