{{/* One MCP server: replicas, rolling update without downtime, probes on /healthz and /readyz, settings from values. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}, app.kubernetes.io/part-of: card-support-mcp}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  # Rolling update: a new pod must be Ready before an old one stops, so the tools never go below the current number
  # of serving pods; a release whose pods never get Ready is rolled back by helm --atomic.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}, app.kubernetes.io/part-of: card-support-mcp}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: MCP_SERVER, value: {{ required "server: card-data | fraud-score | policy-rag" .Values.server | quote }}}
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          {{- with .Values.secretName }}
          envFrom: [{secretRef: {name: {{ . }}}}]
          {{- end }}
          # startup: imports (+ the Feast registries of the servers that read Feast) load; liveness: the process
          # answers; readiness: every dependency of this server's tools answers (/readyz), else no traffic
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false}
