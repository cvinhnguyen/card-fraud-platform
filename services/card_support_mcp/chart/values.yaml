# Defaults of the three MCP servers. One release per server, each with its own values file on top of this one
# (namespace card-support; secrets from infra/k8s/secrets.sh, image pushed to the compose registry):
#   helm upgrade --install card-data-mcp   services/card_support_mcp/chart -f services/card_support_mcp/chart/values-card-data.yaml   -n card-support --atomic --timeout 4m
#   helm upgrade --install fraud-score-mcp services/card_support_mcp/chart -f services/card_support_mcp/chart/values-fraud-score.yaml -n card-support --atomic --timeout 4m
#   helm upgrade --install policy-rag-mcp  services/card_support_mcp/chart -f services/card_support_mcp/chart/values-policy-rag.yaml  -n card-support --atomic --timeout 4m
# --atomic: if the new pods are not Ready in time, Helm rolls the release back to the last good revision.
# The compose registry under the name the kind node and the pods both reach (pushed to as localhost:5001 from the
# host); card-support admits only cosign-signed images from it (infra/k8s/supply-chain.sh).
image:
  repository: registry:5000/card-support-mcp   # one image, three servers (MCP_SERVER picks one)
  tag: "0.2.0"
replicas: 2       # when autoscaling is off
# KEDA (templates/scaledobject.yaml): replicas follow the server's request rate per replica, counted on its pods
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  requestsPerSecond: "15"
  prometheus: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 768Mi}

server: ""         # card-data | fraud-score | policy-rag (app/main.py SERVERS), set per release
description: ""    # what the tools give an agent (kagent tool server)
agent: ""          # the agent (gateway API key user_id) allowed to list and call this server's tools
secretName: ""     # Secret with the passwords / keys this server needs, if any
# Settings of app/settings.py (env names = upper-case field names), common part; servers add their own
env:
  TIMEOUT_S: "5"

networkPolicy:   # templates/networkpolicy.yaml
  enabled: true
  monitoringNamespace: monitoring
  ingressNamespace: nginx-ingress
  public: false    # true: the NGINX ingress may reach it (public Web API, basic auth + HTTPS there)

gateway:
  namespace: agentgateway-system
  name: agentgateway-proxy
  rateLimit: {requests: 300, burst: 50}   # per minute and server, all callers together

kagentNamespace: kagent   # where the RemoteMCPServer (the agents' handle on these tools) lives
