[mutmut]
# Mutate the code of this phase that holds decisions (rubric: only changed code): the tool rules and the service
source_paths =
    app
do_not_mutate =
    app/main.py
    app/clients.py
    app/schemas.py
    app/settings.py
pytest_add_cli_args_test_selection =
    tests/
# the coverage gate belongs to the normal run: mutmut runs a trampolined copy of the code
pytest_add_cli_args =
    -o
    addopts=
