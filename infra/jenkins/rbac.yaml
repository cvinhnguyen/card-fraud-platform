# Jenkins deploys with this ServiceAccount, not with cluster-admin: full rights only in the namespaces the MCP server
# and agents charts write to (their releases, their gateway routes and policies), nothing elsewhere. In `serving` (the
# model server pipeline) a narrower Role: InferenceServices, the drift feed's Broker and Trigger, read access to the
# rollout, and of the Secrets only the image pull secret ghcr-pull.
apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: ci
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: ci
  annotations: {kubernetes.io/service-account.name: jenkins-deployer}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-deployer
rules:
  - apiGroups: ["", apps, networking.k8s.io, policy, autoscaling, batch]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [gateway.networking.k8s.io, agentgateway.dev, kagent.dev, keda.sh, monitoring.coreos.com]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: card-support
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ci-deployer}
subjects: [{kind: ServiceAccount, name: jenkins-deployer, namespace: ci}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: kagent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ci-deployer}
subjects: [{kind: ServiceAccount, name: jenkins-deployer, namespace: ci}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: agentgateway-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ci-deployer}
subjects: [{kind: ServiceAccount, name: jenkins-deployer, namespace: ci}]
---
# services/predictor/Jenkinsfile in `serving`. Kubernetes cannot limit `create` to a resource name (the name is not
# known when the request is authorized), so `create` covers any new Secret in serving; reading, changing and deleting
# are limited to ghcr-pull, so the pipeline can neither read nor overwrite another Secret there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-deployer
  namespace: serving
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [eventing.knative.dev]
    resources: [brokers, triggers]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ghcr-pull]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-model-deployer
  namespace: serving
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: model-deployer}
subjects: [{kind: ServiceAccount, name: jenkins-deployer, namespace: ci}]
