# Fixed NodePorts, reached from the compose network at fraud-control-plane:<port>:
#   31888 KFP API (Airflow retraining)   31880 KFP UI   31080 KServe predictor (scoring API in compose)
apiVersion: v1
kind: Service
metadata: {name: ml-pipeline-nodeport, namespace: kubeflow}
spec:
  type: NodePort
  selector: {app: ml-pipeline}
  ports: [{name: http, port: 8888, targetPort: 8888, nodePort: 31888}]
---
apiVersion: v1
kind: Service
metadata: {name: ml-pipeline-ui-nodeport, namespace: kubeflow}
spec:
  type: NodePort
  selector: {app: ml-pipeline-ui}
  ports: [{name: http, port: 80, targetPort: 3000, nodePort: 31880}]
---
apiVersion: v1
kind: Service
metadata: {name: card-fraud-nodeport, namespace: serving}
spec:
  type: NodePort
  selector: {serving.kserve.io/inferenceservice: card-fraud}
  ports: [{name: http, port: 80, targetPort: 8080, nodePort: 31080}]
