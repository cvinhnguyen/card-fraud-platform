# Kyverno (chart 3.9.1, v1.19.1) only as the admission check of image signatures: no background scans, cleanup or
# policy reports, one replica.
features:
  registryClient:
    allowInsecure: false     # GHCR serves HTTPS
    credentialHelpers: []    # public packages: no registry login needed to read images and signatures
admissionController:
  replicas: 1
  container:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 384Mi}
backgroundController: {enabled: false}
cleanupController: {enabled: false}
reportsController: {enabled: false}
