# Distributed training: the KFP `train` pod (service account pipeline-runner) is a Spark driver that creates its
# executor pods in its own namespace. Only what Spark on Kubernetes needs, only in kubeflow.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: spark-driver, namespace: kubeflow}
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, get, list, watch, delete, deletecollection, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: spark-driver, namespace: kubeflow}
subjects: [{kind: ServiceAccount, name: pipeline-runner, namespace: kubeflow}]
roleRef: {kind: Role, name: spark-driver, apiGroup: rbac.authorization.k8s.io}
