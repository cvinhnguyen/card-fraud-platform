# Layer 3 LLM gateway (agentgateway v1.6): the single entry point of the agents' LLM traffic.
#   /v1/...  -> llm-d router (endpoint picker) -> InferencePool qwen3-8b -> model server pods -> llama.cpp
# The model runs on the host GPU (GTX 1070 is Pascal, CC 6.1: no vLLM), outside the Docker VM, so the pool's pods
# are thin bridges to it; on a GPU node (GKE) the same pool selects real model server pods instead.
# Each route has ONE AgentgatewayPolicy: several policies on the same target silently overwrite each other.
# Secrets (llm-upstream, agentgateway-api-keys) come from infra/k8s/secrets.sh. Installed by infra/k8s/llm-platform.sh.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
---
# The custom model: Qwen3-8B Q4_K_M on llama.cpp, reached through the llm-d InferencePool (release qwen3-8b)
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: qwen3-8b
  namespace: agentgateway-system
spec:
  ai:
    provider:
      custom:
        providerOverride: llama.cpp
        model: qwen3-8b
        backendRef: {group: inference.networking.k8s.io, kind: InferencePool, name: qwen3-8b}
        formats:
          - {type: Completions, path: /v1/chat/completions}
---
# LLM version B of the A/B test: Qwen3.8-27B on Groq (free tier: 1,000 requests a day, 8,000 tokens a minute). Same
# route and policy as version A, so callers keep sending model qwen3-8b and the PII masking runs before any prompt
# leaves the cluster. Key from Vault (secrets.sh, llm-groq).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: qwen3-8-27b-groq
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: qwen/qwen3.8-27b
      host: api.groq.com
      port: 443
      path: /openai/v1/chat/completions
  policies:
    auth:
      secretRef: {name: llm-groq}
    tls:
      sni: api.groq.com
    ai:
      # a request without max_tokens is charged against the free tier's 1,000 output tokens a minute at the model's
      # full output size, so Groq refuses it (429); agents send none
      defaults: [{field: max_tokens, value: 512}]
---
# A/B test of two LLM versions: a new version gets a share of the traffic instead of replacing the current one; the
# "A/B tests" Grafana dashboard compares them by model, and the weights move (or the B ref goes) once it is decided.
# Header x-llm-variant: a|b pins a request to one version (evaluations, tests). Groq's edge (Cloudflare 1010) refuses
# some client User-Agents such as Python's, so the gateway sets its own on that backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs: [{name: agentgateway-proxy}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /v1}, headers: [{name: x-llm-variant, value: a}]}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: qwen3-8b}]
      timeouts: {request: 300s}
    - matches: [{path: {type: PathPrefix, value: /v1}, headers: [{name: x-llm-variant, value: b}]}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: qwen3-8-27b-groq, filters: [{type: RequestHeaderModifier, requestHeaderModifier: {set: [{name: User-Agent, value: agentgateway}]}}]}]
      timeouts: {request: 300s}
    # Canary stopped on 2026-10-21 (docs/ab_testing.md): at 20 % the dashboard showed B refusing agent calls (429, the
    # free tier's output tokens a minute). B stays reachable with the header; raise its weight again on a paid tier.
    - matches: [{path: {type: PathPrefix, value: /v1}}]
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: qwen3-8b, weight: 100}
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: qwen3-8-27b-groq, weight: 0,
           filters: [{type: RequestHeaderModifier, requestHeaderModifier: {set: [{name: User-Agent, value: agentgateway}]}}]}
      timeouts: {request: 300s}
---
# Security and policy of the LLM route: who may call (API key), how much (tokens and requests), and no PII to or
# from the model (masked, not rejected: a support chat should go on with the number hidden).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm}]
  traffic:
    apiKeyAuthentication:
      mode: Strict
      configMapSelector: {matchLabels: {agentgateway.dev/apikey: "true"}}
    rateLimit:
      local:
        - {requests: 120, unit: Minutes, burst: 20}
        - {tokens: 60000, unit: Minutes}
  backend:
    ai:
      promptGuard:
        request: &pii
          - regex:
              action: Mask
              builtins: [CreditCard, Email, PhoneNumber]
              matches:
                - "\\b0\\d{11}\\b"                       # Vietnamese citizen ID (CCCD): 12 digits, province code first
                - "(?:\\+84|\\b0)[35789]\\d{8}\\b"      # Vietnamese mobile number
        response: *pii
---
# Pool endpoint for the host's llama.cpp: forwards to it with the model server's key (the agents never hold it).
# Ready only when llama.cpp's /health is 200, so the endpoint picker skips it while the model loads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-8b-bridge
  namespace: agentgateway-system
data:
  default.conf.template: |
    server {
      listen 8000;
      access_log off;                  # the endpoint picker polls /metrics every 50 ms
      location / {
        proxy_pass http://host.docker.internal:8085;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${LLM_API_KEY}";
        proxy_buffering off;           # streamed tokens go out as they come
        proxy_read_timeout 300s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b
  namespace: agentgateway-system
spec:
  replicas: 1   # ponytail: one GPU, one llama.cpp (2 slots); more bridges add no capacity
  selector: {matchLabels: {app: qwen3-8b}}
  template:
    metadata:
      labels: {app: qwen3-8b}
    spec:
      containers:
        - name: bridge
          image: nginx:1.29.1-alpine
          env:
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: llm-upstream, key: Authorization}}}
            - {name: NGINX_ENVSUBST_FILTER, value: "^LLM_API_KEY$"}   # substitute only the key, keep $nginx vars
          ports: [{containerPort: 8000, name: http}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          volumeMounts: [{name: conf, mountPath: /etc/nginx/templates}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - {name: conf, configMap: {name: qwen3-8b-bridge}}
