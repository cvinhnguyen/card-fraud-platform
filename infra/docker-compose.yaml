# Card fraud platform — Layer 1 infrastructure.
#
# Profiles keep RAM usage inside 16 GB: start only what the current phase needs.
#   core  : postgres (core banking, "another department") + seaweedfs (S3 lake) + kafka
#   batch : spark master + worker, hive metastore (+ its postgres), trino; needs core running
#   dbt   : spark thrift server for dbt-spark (needs batch)
#   (next) stream / orch / gov
#
# Usage (from repo root):
#   python infra/make_env.py                       # once: secrets into infra/.env + s3.json
#   docker compose -f infra/docker-compose.yaml --profile core up -d
#   python infra/init_infra.py                     # buckets + topics
#   docker compose -f infra/docker-compose.yaml --profile core --profile batch up -d --build

name: fraud

services:
  # Core banking database owned by another department (source for DP1).
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    container_name: core-banking-db
    environment:
      POSTGRES_DB: core_banking
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"   # host 5433: 5432 is often taken by other local projects
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d core_banking"]
      interval: 10s
      retries: 5

  # S3-compatible object storage: export files (another department) + lakehouse bronze/silver/gold.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [core]
    container_name: seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # Filer UI
      - "127.0.0.1:9333:9333"   # Master UI
    volumes:
      - ./conf/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data

  # Kafka in KRaft mode. Containers use kafka:19092, the host uses 127.0.0.1:9092.
  kafka:
    image: apache/kafka:3.9.0
    profiles: [core]
    container_name: kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # empty host = all interfaces; Kafka 3.9 rejects a literal 0.0.0.0 here (it leaks into advertised.listeners)
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092   # IPv4: librdkafka tries ::1 first for "localhost", 1 s lost per connect
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by init_infra.py
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 10
      start_period: 20s

  # ---------- batch (P3-P4) ----------

  # Hive Metastore backend. Ours, so it is not inside the core banking database.
  metastore-db:
    image: postgres:16-alpine
    profiles: [batch]
    container_name: metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${METASTORE_DB_PASSWORD}
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      retries: 5

  # Table catalog shared by Spark (and later Spark Thrift Server / dbt) and Trino.
  hive-metastore:
    build: ./hive
    image: fraud/hive-metastore:3.1.3
    profiles: [batch]
    container_name: hive-metastore
    depends_on:
      metastore-db: {condition: service_healthy}
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: -Xmx512m
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./conf/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro

  # Spark standalone. Jobs run with `docker compose exec spark-master /opt/spark/bin/spark-submit /opt/jobs/<job>.py`,
  # so the driver lives in this container (UI on :4040 while a job runs).
  spark-master:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    profiles: [batch]
    container_name: spark-master
    hostname: spark-master
    # the event log dir must exist before any driver starts (spark.eventLog.dir)
    command: bash -c "mkdir -p /opt/spark/work-dir/events && exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    environment:
      CORE_DB_USER: ${CORE_DB_USER}   # JDBC source, read by the job
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8080:8080"   # master UI
      - "127.0.0.1:4040:4040"   # driver UI
    volumes: &spark-volumes
      - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../spark:/opt/jobs:ro
      - spark_ivy:/opt/spark/work-dir   # Maven jars cache (spark.jars.ivy); spark-owned dir in the image

  spark-worker:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    profiles: [batch]
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_CORES: 8     # 12 on the host; skew only shows when the hot key is > 1/cores of the data
      SPARK_WORKER_MEMORY: 3g   # one 2g executor + headroom; the Docker VM has 8 GB
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8081:8081"   # worker UI (executor logs)
    volumes: *spark-volumes

  # UI of finished Spark apps (stage timelines for the skew benchmark), read from the shared event log dir.
  spark-history:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    profiles: [batch]
    container_name: spark-history
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    depends_on: [spark-master]
    environment:
      SPARK_DAEMON_MEMORY: 512m
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=file:/opt/spark/work-dir/events
    ports:
      - "127.0.0.1:18080:18080"
    volumes: *spark-volumes

  # SQL endpoint for dbt-spark (novel idea 1). Own profile: while up it holds 2 cores / 1 GB on the worker,
  # so stop it during Spark benchmarks.  docker compose ... --profile dbt up -d spark-thrift
  spark-thrift:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    profiles: [dbt]
    container_name: spark-thrift
    hostname: spark-thrift   # executors call back to the driver by this name
    # S3A + Delta jars also on the JVM classpath: with --packages alone, thrift session threads miss their classes
    # (NoClassDefFoundError). Listed one by one: the whole ivy dir brings an old jackson that breaks Spark.
    # ponytail: paths pin the versions in spark-defaults.conf; P9 bakes the jars into the image instead.
    command: >-
      /opt/spark/sbin/start-thriftserver.sh --conf spark.cores.max=2 --conf spark.executor.memory=1g
      --conf spark.driver.extraClassPath=/opt/spark/work-dir/ivy/jars/org.apache.hadoop_hadoop-aws-3.4.2.jar:/opt/spark/work-dir/ivy/jars/software.amazon.awssdk_bundle-2.29.52.jar:/opt/spark/work-dir/ivy/jars/software.amazon.s3.analyticsaccelerator_analyticsaccelerator-s3-1.2.1.jar:/opt/spark/work-dir/ivy/jars/org.wildfly.openssl_wildfly-openssl-2.1.4.Final.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-spark_4.1_2.13-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-storage-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-kernel-api-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-kernel-defaults-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-kernel-unitycatalog-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.unitycatalog_unitycatalog-client-0.6.0.jar:/opt/spark/work-dir/ivy/jars/io.unitycatalog_unitycatalog-hadoop-0.6.0.jar Files\Git\opt\spark\work-dir\ivy\jars\org.apache.hadoop_hadoop-aws-3.4.2.jar;C:\Program Files\Git\opt\spark\work-dir\ivy\jars\software.amazon.awssdk_bundle-2.29.52.jar;C:\Program Files\Git\opt\spark\work-dir\ivy\jars\software.amazon.s3.analyticsaccelerator_analyticsaccelerator-s3-1.2.1.jar;C:\Program Files\Git\opt\spark\work-dir\ivy\jars\org.wildfly.openssl_wildfly-openssl-2.1.4.Final.jar
      --conf spark.executor.extraClassPath=/opt/spark/work-dir/ivy/jars/org.apache.hadoop_hadoop-aws-3.4.2.jar:/opt/spark/work-dir/ivy/jars/software.amazon.awssdk_bundle-2.29.52.jar:/opt/spark/work-dir/ivy/jars/software.amazon.s3.analyticsaccelerator_analyticsaccelerator-s3-1.2.1.jar:/opt/spark/work-dir/ivy/jars/org.wildfly.openssl_wildfly-openssl-2.1.4.Final.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-spark_4.1_2.13-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-storage-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-kernel-api-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-kernel-defaults-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.delta_delta-kernel-unitycatalog-4.4.1.jar:/opt/spark/work-dir/ivy/jars/io.unitycatalog_unitycatalog-client-0.6.0.jar:/opt/spark/work-dir/ivy/jars/io.unitycatalog_unitycatalog-hadoop-0.6.0.jar Files\Git\opt\spark\work-dir\ivy\jars\org.apache.hadoop_hadoop-aws-3.4.2.jar;C:\Program Files\Git\opt\spark\work-dir\ivy\jars\software.amazon.awssdk_bundle-2.29.52.jar;C:\Program Files\Git\opt\spark\work-dir\ivy\jars\software.amazon.s3.analyticsaccelerator_analyticsaccelerator-s3-1.2.1.jar;C:\Program Files\Git\opt\spark\work-dir\ivy\jars\org.wildfly.openssl_wildfly-openssl-2.1.4.Final.jar
    environment:
      SPARK_NO_DAEMONIZE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:10000:10000"   # HiveServer2 protocol (dbt, beeline)
      - "127.0.0.1:4041:4040"     # its Spark UI
    volumes: *spark-volumes

  # SQL over the lakehouse through the metastore: catalog `delta`.
  trino:
    image: trinodb/trino:484
    profiles: [batch]
    container_name: trino
    depends_on: [hive-metastore]
    mem_limit: 2g   # JVM heap = 80% of this
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8090:8080"   # 8080 is the Spark master UI
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog:ro

# ponytail: named volumes live in Docker's WSL disk. Before the 100 GB phase, move Docker Desktop's
# disk image to E: (Settings → Resources → Advanced → Disk image location) instead of bind-mounting NTFS.
volumes:
  postgres_data:
  seaweedfs_data:
  kafka_data:
  metastore_db_data:
  spark_ivy:
