# Shared by every Spark container (master, worker, drivers started with spark-submit).
# S3 credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the container env (S3A's default chain).

spark.master                                   spark://spark-master:7077

# Delta, S3A, Postgres JDBC and OpenLineage jars are baked into /opt/spark/jars of the image fraud/spark
# (infra/spark/Dockerfile): nothing is resolved at spark-submit time.

spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalogImplementation                hive
spark.hadoop.hive.metastore.uris               thrift://hive-metastore:9083
spark.sql.warehouse.dir                        s3a://lakehouse/warehouse

spark.hadoop.fs.s3a.endpoint                   http://seaweedfs:8333
spark.hadoop.fs.s3a.endpoint.region            us-east-1
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
# Bucket `bronze` is the lakeFS repository of the nightly export (s3a://bronze/<branch>/raw_transactions): S3A sends it
# to the lakeFS S3 gateway with the lakeFS keys (Hadoop reads ${env.X} from the container env); every other
# bucket stays on SeaweedFS.
spark.hadoop.fs.s3a.bucket.bronze.endpoint     http://lakefs:8000
spark.hadoop.fs.s3a.bucket.bronze.access.key   ${env.LAKEFS_ACCESS_KEY_ID}
spark.hadoop.fs.s3a.bucket.bronze.secret.key   ${env.LAKEFS_SECRET_ACCESS_KEY}

spark.driver.memory                            1g
spark.executor.memory                          2g
spark.sql.session.timeZone                     Asia/Ho_Chi_Minh

# Event logs for the history server (:18080), so the UI of a finished job can still be opened and screenshotted.
spark.eventLog.enabled                         true
spark.eventLog.dir                             file:/opt/spark/work-dir/events

# OpenLineage (docs/openlineage.md). The listener reads every query plan and posts lineage (inputs, outputs, column-level) to
# DataHub's OpenLineage endpoint: no lineage code in any job or DAG. Fail-safe: with DataHub down (gov profile off)
# it logs the HTTP error and the job carries on.
spark.extraListeners                           io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type               http
spark.openlineage.transport.url                http://datahub-gms:8080
spark.openlineage.transport.endpoint           /openapi/openlineage/api/v1/lineage
spark.openlineage.namespace                    card-fraud-platform
