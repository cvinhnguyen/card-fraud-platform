# bronze.raw_transactions lives in lakeFS (repository bronze, branch main): SELECT * FROM lakefs.bronze.raw_transactions.
# Same metastore as catalog `delta`, other endpoint: the lakeFS S3 gateway. Every other table: catalog delta.
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true
s3.endpoint=http://lakefs:8000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:LAKEFS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:LAKEFS_SECRET_ACCESS_KEY}
